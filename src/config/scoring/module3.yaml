AAIDC Module 3 Repository Evaluation:
  Production Readiness:
    deployment_configuration:
      name: Deployment Configuration
      description: Presence of deployment files (Docker, requirements.txt, environment setup)
      essential: true
      professional: true
      elite: true
      include_extensions:
      - .txt
      - .yml
      - .yaml
      - .dockerfile
      - .py
      aggregation: OR
      based_on: file_content
      instructions: |
        Look for requirements.txt, environment.yml, Dockerfile, setup.py, or pyproject.toml files.
        Also check for deployment scripts or configuration files.

    application_entry_point:
      name: Application Entry Point
      description: Clear main application file or entry point (app.py, main.py, etc.)
      essential: true
      professional: true
      elite: true
      include_extensions:
      - .py
      aggregation: OR
      based_on: file_content
      instructions: |
        Look for main application files like app.py, main.py, or files that contain application startup code.

  Testing Suite:
    test_file_presence:
      name: Test File Presence
      description: Comprehensive test files covering unit, integration, and end-to-end tests
      essential: true
      professional: true
      elite: true
      aggregation: OR
      based_on: file_content
      instructions: |
        Look for test files with naming patterns like test_*.py, *_test.py, or tests/ directory structure.
    
    test_framework_usage:
      name: Test Framework Implementation
      description: Evidence of testing frameworks (pytest, unittest) with proper test structure
      essential: true
      professional: true
      elite: true
      include_extensions:
      - .py
      aggregation: OR
      based_on: file_content
      instructions: |
        Look for imports of testing frameworks and actual test function implementations.
    
    test_coverage_config:
      name: Test Coverage Configuration
      description: Test coverage configuration and reporting setup
      essential: false
      professional: true
      elite: true
      aggregation: OR
      based_on: file_content
      instructions: |
        Look for coverage configuration files (.coveragerc, pytest.ini) or coverage reporting in CI/CD.
    
    agent_communication_tests:
      name: Multi-Agent Integration Tests
      description: Tests specifically for agent-to-agent communication and workflows
      essential: true
      professional: true
      elite: true
      include_extensions:
      - .py
      aggregation: OR
      based_on: file_content
      instructions: |
        Look for test functions that test agent interactions, multi-agent workflows, or end-to-end system behavior.

